    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f3f4f6;
            --gray: #9ca3af;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--dark); color: white; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }
        .header { background-color: var(--primary); padding: 15px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10; }
        .header svg { width: 24px; height: 24px; }
        .tabs { display: flex; background-color: #374151; padding: 10px; gap: 10px; }
        .tab { flex: 1; padding: 12px; text-align: center; background-color: #4b5563; border-radius: 8px; font-weight: bold; color: #d1d5db; }
        .tab.active { background-color: var(--primary); color: white; }
        .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .view { display: none; flex-direction: column; height: 100%; padding: 15px; overflow-y: auto; }
        .view.active { display: flex; }
        
        .input-display { background: #111827; border: 2px solid #374151; border-radius: 12px; font-size: 28px; padding: 20px; text-align: center; letter-spacing: 2px; margin-bottom: 15px; min-height: 75px; display: flex; align-items: center; justify-content: center; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; flex: 1; }
        .num-btn { background: #374151; border: none; border-radius: 12px; color: white; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
        .num-btn:active { background: #6b7280; }
        .num-btn.clear { background: var(--danger); }
        .num-btn.search { background: var(--primary); grid-column: span 3; padding: 15px; }
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn { padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; color: white; text-align: center; }
        .btn-green { background: var(--success); }
        .btn-blue { background: var(--primary); }
        .btn-red { background: var(--danger); }
        .btn-full { width: 100%; margin-bottom: 10px; }
        
        .result-card { background: #374151; border-radius: 12px; padding: 15px; margin-top: 15px; }
        .result-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #60a5fa; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 18px; }
        .price-tag { font-size: 24px; font-weight: bold; color: var(--success); }
        
        #scanner-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 100; display: none; flex-direction: column; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        .scanner-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 150px; border: 2px solid var(--success); box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); border-radius: 12px; }
        .scanner-laser { width: 100%; height: 2px; background: red; position: absolute; top: 50%; animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        .close-scanner { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 15px 40px; background: var(--danger); border-radius: 30px; color: white; font-weight: bold; border: none; font-size: 18px; }
        
        #qty-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: #1f2937; padding: 20px; border-top: 4px solid var(--primary); display: none; flex-direction: column; z-index: 110; box-shadow: 0 -10px 20px rgba(0,0,0,0.5); border-radius: 20px 20px 0 0; }
        .qty-header { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 5px; color: #60a5fa; }
        .qty-desc { text-align: center; color: var(--gray); margin-bottom: 5px; }
        .qty-price { text-align: center; color: var(--success); font-weight: bold; font-size: 20px; margin-bottom: 15px; }
        .qty-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .qty-btn { background: #374151; width: 60px; height: 60px; border-radius: 50%; font-size: 30px; color: white; border: none; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .qty-display { font-size: 40px; font-weight: bold; min-width: 60px; text-align: center; }
        .speed-success { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 15px 30px; border-radius: 12px; font-size: 20px; font-weight: bold; display: none; z-index: 120; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 200; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--dark); padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #374151; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--gray); font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #4b5563; background: #111827; color: white; font-size: 16px; }
        
        .custom-alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #374151; border-left: 5px solid var(--primary); padding: 15px 20px; border-radius: 8px; font-weight: bold; z-index: 300; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: center; width: 80%; max-width: 400px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #374151; }
        th { background: #111827; color: var(--gray); }
        .old-price { color: var(--danger); text-decoration: line-through; margin-right: 5px; font-size: 12px;}
        .db-stats { text-align: center; padding: 10px; background: #111827; border-radius: 8px; margin-bottom: 15px; color: #9ca3af; font-size: 14px; }
        .db-stats span { color: var(--success); font-weight: bold; font-size: 18px; }
        .archive-card { background: #111827; border: 1px solid #374151; padding: 15px; border-radius: 8px; margin-bottom: 10px; }

        #print-label-area { display: none; }

        @media print {

            .header, .tabs, .numpad, .action-row, .btn, #scanner-container, .input-display, .modal { display: none !important; }
            .content, .view { display: block !important; padding: 0; overflow: visible; }

            #inventory-tools { display: none !important; }

            body.printing-modal .modal { position: static; display: block !important; background: white; padding: 0; }
            body.printing-modal .modal-content { border: none; width: 100%; max-width: 100%; color: black; background: white; }
            body.printing-modal table th { background: #f3f4f6; color: black; }
            body.printing-modal table td { border-bottom: 1px solid #ccc; }
            
            /* Shelf Tag Label Printing Overrides */
            body.printing-label .content { display: none !important; }
            body.printing-label #print-label-area { 
                display: flex !important; 
                position: absolute; left: 0; top: 0; 
                margin: 0; padding: 0; background: white; 
                width: 100%; height: 100%; 
                justify-content: flex-start; align-items: flex-start; 
            }
            .shelf-tag { border: 1px dashed #999; background: white; color: black; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 5px; box-sizing: border-box; page-break-inside: avoid; overflow: hidden; }
            .shelf-tag-title { font-size: 14px; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; width: 100%; text-align: center; margin: 0; }
            .shelf-tag-price { font-size: 32px; font-weight: bold; margin: 2px 0; }
            .shelf-tag-barcode { max-width: 100%; height: 40px; }
            
            .tag-standard { width: 2.5in; height: 1.25in; }
            .tag-large { width: 3in; height: 2in; }
            .tag-large .shelf-tag-title { font-size: 18px; margin-top: 5px; }
            .tag-large .shelf-tag-price { font-size: 48px; }
            .tag-large .shelf-tag-barcode { height: 60px; margin-bottom: 5px; }
            .tag-peg { width: 2in; height: 1.25in; }
            .tag-peg .shelf-tag-title { font-size: 12px; }
            .tag-peg .shelf-tag-price { font-size: 26px; }
            .tag-peg .shelf-tag-barcode { height: 35px; }
        }

}

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(type = 'tap') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            if (type === 'tap') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'success') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
        }
    </script>

    <script>
        let inventory = {};
        let modifiedItems = {};
        let archives = [];
        let currentInput = "";
        let stream = null;
        let barcodeDetector = null;
        let zxingReader = null;
        let isSpeedScan = false;
        let lockedUPC = null;
        let lockedQty = 0;
        let currentPrintUPC = null;
        let pluDirectoryHandle = null;

        window.onload = () => {
            try {
                const saved = localStorage.getItem('commander_inventory');
                if(saved) {
                    inventory = JSON.parse(saved);
                    document.getElementById('db-count').innerText = Object.keys(inventory).length;
                }
                const mods = localStorage.getItem('commander_modified');
                if(mods) {
                    modifiedItems = JSON.parse(mods);
                    updateInventoryTable();
                }
                const savedArchives = localStorage.getItem('commander_archives');
                if(savedArchives) {
                    archives = JSON.parse(savedArchives);
                }
            } catch(e) {}

            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['qr_code', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
            } else if (typeof ZXing !== 'undefined') {
                zxingReader = new ZXing.BrowserMultiFormatReader();
            }

            // Upgraded input logic: Allow smartphone folder selection for XML batches fallback
            const xmlInput = document.getElementById('xml-upload');
            if(xmlInput) {
                xmlInput.setAttribute('multiple', 'true');
                xmlInput.setAttribute('webkitdirectory', 'true');
                xmlInput.setAttribute('directory', 'true');
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            if ('showDirectoryPicker' in window) {
                try {
                    let db = await openDB();
                    pluDirectoryHandle = await getFromDB(db, 'pluFolderHandle');
                    if (pluDirectoryHandle) {
                        document.getElementById('sync-plu-btn').style.display = 'block';
                        document.getElementById('select-folder-btn').innerText = "📂 Change PLU Folder...";
                    }
                } catch(e) {}
            }
        });

        function showAlert(msg, color = 'var(--primary)') {
            const al = document.getElementById('customAlert');
            al.innerText = msg;
            al.style.borderLeftColor = color;
            al.style.display = 'block';
            setTimeout(() => al.style.display = 'none', 3000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('view-' + tab).classList.add('active');
            event.target.classList.add('active');
        }

        function forceUpdateApp() {
            showAlert("Checking for updates...", "var(--primary)");
            if ('caches' in window) {
                caches.keys().then((names) => {
                    names.forEach(name => caches.delete(name));
                });
            }
            setTimeout(() => window.location.reload(true), 1000);
        }

        function archiveCurrentList() {
            if(Object.keys(modifiedItems).length === 0) {
                showAlert("List is already empty.", "var(--danger)");
                return;
            }
            if(confirm("Are you sure you want to save this list to Archives and start a fresh list?")) {
                let currentDateTime = new Date().toLocaleString();
                archives.push({ date: currentDateTime, items: { ...modifiedItems } });
                modifiedItems = {};
                persistData();
                updateInventoryTable();
                showAlert("List archived and cleared!", "var(--success)");
            }
        }

        function openArchiveModal() {
            document.getElementById('archive-modal-title').innerText = "Past Archives";
            const container = document.getElementById('archive-list-container');
            container.innerHTML = "";
            
            if(archives.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:var(--gray);'>No past archives found.</p>";
            } else {
                let displayArchives = archives.slice().reverse();
                displayArchives.forEach((arch, index) => {
                    let originalIndex = archives.length - 1 - index;
                    let itemCount = Object.keys(arch.items).length;
                    container.innerHTML += `
                        <div class="archive-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                                <strong>${arch.date}</strong><span style="color:var(--gray);">${itemCount} items</span>
                            </div>
                            <button class="btn btn-blue btn-full" style="padding: 10px; font-size:14px;" onclick="viewArchiveDetails(${originalIndex})">📂 View Items</button>
                        </div>
                    `;
                });
            }
            
            document.getElementById('archive-modal-actions').innerHTML = `<button class="btn btn-full" style="background:#6b7280; grid-column: span 2;" onclick="closeArchiveModal()">Close</button>`;
            document.body.classList.add('modal-open');
            document.getElementById('archive-modal').style.display = 'flex';
        }

        function viewArchiveDetails(index) {
            let arch = archives[index];
            document.getElementById('archive-modal-title').innerText = `Archive: ${arch.date}`;
            const container = document.getElementById('archive-list-container');
            
            let html = `<table style="width:100%; font-size:12px;"><thead><tr><th>UPC</th><th>Desc</th><th>Qty</th><th>Price</th></tr></thead><tbody>`;
            for(let upc in arch.items) {
                let item = arch.items[upc];
                let priceHtml = item.oldPrice && item.oldPrice !== item.price ? `<span class="old-price">$${item.oldPrice}</span>$${item.price}` : `$${item.price}`;
                html += `<tr><td>${upc}</td><td>${item.desc}</td><td>${item.qty||0}</td><td>${priceHtml}</td></tr>`;
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
            
            document.getElementById('archive-modal-actions').innerHTML = `
                <button class="btn btn-blue" onclick="openArchiveModal()">⬅️ Back to List</button>
                <button class="btn" style="background:#6b7280;" onclick="window.print()">🖨️ Print List</button>
                <button class="btn btn-red" style="grid-column: span 2;" onclick="deleteArchive(${index})">🗑️ Delete Archive</button>
            `;
            document.body.classList.add('printing-modal');
        }

        function deleteArchive(index) {
            if(confirm("Are you sure you want to permanently delete this archive?")) {
                archives.splice(index, 1);
                persistData();
                openArchiveModal();
            }
        }

        function closeArchiveModal() {
            document.body.classList.remove('modal-open');
            document.body.classList.remove('printing-modal');
            document.getElementById('archive-modal').style.display = 'none';
        }

        function typeNum(val) {
            playBeep('tap');
            if (val === 'C') { currentInput = ""; } 
            else if (val === 'DEL') { currentInput = currentInput.slice(0, -1); } 
            else { currentInput += val; }
            document.getElementById('upc-display').innerText = currentInput || "Ready";
        }

        function stripZeros(upc) { return upc.replace(/^0+/, ''); }
        function formatUPC14(upc) { return stripZeros(upc).padStart(14, '0'); }

        function fuzzyMatchUPCAll(scannedCode) {
            let strippedScan = stripZeros(scannedCode);
            let matches = new Set();
            
            Object.keys(inventory).forEach(k => { if (stripZeros(k) === strippedScan) matches.add(k); });
            Object.keys(inventory).forEach(k => { if (stripZeros(k).startsWith(strippedScan)) matches.add(k); });

            if(strippedScan.length === 8) {
                let prefix7 = strippedScan.substring(0, 7);
                Object.keys(inventory).forEach(k => {
                    if (stripZeros(k).startsWith(prefix7)) matches.add(k);
                });
            }

            if(strippedScan.length >= 7) {
                let coreScan = strippedScan.substring(0, strippedScan.length - 1);
                Object.keys(inventory).forEach(k => {
                    let kStripped = stripZeros(k);
                    if (kStripped.startsWith(coreScan) || kStripped.includes(coreScan)) matches.add(k);
                });
            }

            return Array.from(matches);
        }
        
        function fuzzyMatchUPC(scannedCode) {
            let all = fuzzyMatchUPCAll(scannedCode);
            return all.length > 0 ? all[0] : null;
        }

        function searchUPC(upcToSearch = null) {
            let target = upcToSearch || currentInput;
            if (!target) return;
            playBeep('success');
            
            let matchedKeys = fuzzyMatchUPCAll(target);
            const container = document.getElementById('result-container');
            container.innerHTML = '';
            
            if (matchedKeys.length === 0) {
                container.innerHTML = `
                <div class="result-card" style="text-align:center;">
                    <h3 style="color:var(--danger);margin-bottom:15px;">Item Not Found</h3>
                    <p style="margin-bottom:15px;">Scanned: ${stripZeros(target)}</p>
                    <button class="btn btn-green btn-full" onclick="openAddModal('${formatUPC14(target)}')">➕ Add New Item</button>
                </div>`;
            } else {
                let html = matchedKeys.length > 1 
                    ? `<h3 style="margin-top:15px; color:var(--success); text-align:center;">Found ${matchedKeys.length} Matching Items</h3>` 
                    : ``;
                    
                matchedKeys.forEach(upc => {
                    let item = inventory[upc];
                    let modQty = modifiedItems[upc] ? modifiedItems[upc].qty : (item.qty || 0);
                    let priceHtml = item.oldPrice && item.oldPrice !== item.price ? `<span class="old-price">$${parseFloat(item.oldPrice).toFixed(2)}</span> $${parseFloat(item.price).toFixed(2)}` : `$${parseFloat(item.price).toFixed(2)}`;
                    
                    html += `
                    <div class="result-card">
                        <div class="result-title">${item.desc}</div>
                        <div class="result-row"><span>UPC:</span> <span>${upc}</span></div>
                        <div class="result-row"><span>Dept:</span> <span>${item.dept || "1"}</span></div>
                        <div class="result-row"><span>Qty on Hand:</span> <span>${modQty}</span></div>
                        <div class="result-row" style="margin-top:10px;"><span>Price:</span> <span class="price-tag">${priceHtml}</span></div>
                        
                        <div class="action-row" style="margin-top:15px;">
                            <button class="btn btn-blue" onclick="openEditModal('${upc}')">✏️ Edit</button>
                            <button class="btn btn-green" onclick="openPrintModal('${upc}')">🏷️ Print Tag</button>
                        </div>
                        <button class="btn btn-red btn-full" style="margin-top:10px;" onclick="deleteItem('${upc}')">🗑️ Delete</button>
                    </div>`;
                });
                container.innerHTML = html;
            }
        }
        function openPrintModal(upc) {
            currentPrintUPC = upc;
            let item = inventory[upc];
            document.getElementById('print-label-desc').innerText = item.desc;
            document.getElementById('print-label-upc').innerText = "UPC: " + upc;
            document.getElementById('print-label-modal').style.display = 'flex';
        }

        function executePrintLabel() {
            let upc = currentPrintUPC;
            let item = inventory[upc];
            if (!item) return;

            let tagSize = document.getElementById('print-label-size').value;
            
            document.getElementById('tag-print-desc').innerText = item.desc;
            document.getElementById('tag-print-price').innerText = "$" + parseFloat(item.price).toFixed(2);
            
            try {
                JsBarcode("#tag-print-barcode", stripZeros(upc), {
                    format: "UPC", 
                    displayValue: true,
                    margin: 0,
                    height: 40,
                    valid: function(valid) {
                        if(!valid) { JsBarcode("#tag-print-barcode", stripZeros(upc), { format: "CODE128", displayValue: true, margin: 0, height: 40 }); }
                    }
                });
            } catch(e) {
                JsBarcode("#tag-print-barcode", stripZeros(upc), { format: "CODE128", displayValue: true, margin: 0, height: 40 });
            }

            let tagElem = document.getElementById('active-print-tag');
            tagElem.className = "shelf-tag " + tagSize;

            closeModal('print-label-modal');
            
            document.body.classList.add('printing-label');
            window.print();
            
            setTimeout(() => { document.body.classList.remove('printing-label'); }, 1500);
        }

        function openEditModal(upc) {
            let item = inventory[upc] || modifiedItems[upc];
            document.getElementById('modal-title').innerText = "Edit Item";
            document.getElementById('edit-upc').value = upc;
            document.getElementById('edit-upc').readOnly = true;
            document.getElementById('edit-desc').value = item.desc;
            document.getElementById('edit-price').value = item.price;
            document.getElementById('edit-qty').value = modifiedItems[upc] ? modifiedItems[upc].qty : (item.qty || 0);
            document.getElementById('edit-dept').value = item.dept || "1";
            document.getElementById('edit-mod').value = item.mod || "000";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openAddModal(upc) {
            document.getElementById('modal-title').innerText = "Add New Item";
            document.getElementById('edit-upc').value = upc;
            document.getElementById('edit-upc').readOnly = false;
            document.getElementById('edit-desc').value = "";
            document.getElementById('edit-price').value = "0.00";
            document.getElementById('edit-qty').value = "1";
            document.getElementById('edit-dept').value = "1";
            document.getElementById('edit-mod').value = "000";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        function saveItem() {
            let upc = formatUPC14(document.getElementById('edit-upc').value);
            let desc = document.getElementById('edit-desc').value;
            let price = parseFloat(document.getElementById('edit-price').value).toFixed(2);
            let qty = parseInt(document.getElementById('edit-qty').value) || 0;
            let dept = document.getElementById('edit-dept').value;
            let mod = document.getElementById('edit-mod').value;
            if(!upc || !desc) { showAlert("UPC and Description required", "var(--danger)"); return; }
            let oldPrice = inventory[upc] ? inventory[upc].price : price;
            
            let newItem = { desc, price, oldPrice, qty, dept, mod, status: inventory[upc] ? 'MODIFIED' : 'NEW' };
            inventory[upc] = { ...inventory[upc], ...newItem };
            modifiedItems[upc] = newItem;
            persistData(); updateInventoryTable(); closeModal('edit-modal'); searchUPC(upc);
            showAlert("Item Saved!", "var(--success)");
        }

        function deleteItem(upc) {
            if(confirm("Are you sure you want to delete " + upc + "?")) {
                let item = inventory[upc];
                item.status = 'DELETED';
                modifiedItems[upc] = item;
                delete inventory[upc];
                persistData(); updateInventoryTable(); 
                document.getElementById('result-container').innerHTML = "";
                showAlert("Item Deleted", "var(--danger)");
            }
        }

        async function openCamera(speedMode = false) {
            isSpeedScan = speedMode; lockedUPC = null;
            document.getElementById('qty-panel').style.display = 'none';
            document.getElementById('scanner-container').style.display = 'flex';
            const video = document.getElementById('camera-feed');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                requestAnimationFrame(scanVideo);
            } catch (err) {
                showAlert("Camera permission denied.", "var(--danger)"); closeCamera();
            }
        }

        function closeCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            document.getElementById('scanner-container').style.display = 'none';
            isSpeedScan = false;
        }

        async function scanVideo() {
            if (!stream || document.getElementById('scanner-container').style.display === 'none') return;
            const video = document.getElementById('camera-feed');
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                if (barcodeDetector) {
                    try {
                        const barcodes = await barcodeDetector.detect(video);
                        if (barcodes.length > 0) { handleScanResult(barcodes[0].rawValue); return; }
                    } catch (e) {}
                } else if (zxingReader) {
                    try {
                        const result = await zxingReader.decodeFromVideoElement(video);
                        if (result) { handleScanResult(result.text); return; }
                    } catch (e) {}
                }
            }
            
            if (document.getElementById('scanner-container').style.display !== 'none') {
                requestAnimationFrame(scanVideo);
            }
        }

        function handleScanResult(code) {
            if (isSpeedScan) {
                let matchedKey = fuzzyMatchUPC(code);
                let upc = matchedKey ? matchedKey : formatUPC14(code);
                
                if (lockedUPC === null) {
                    playBeep('success'); lockedUPC = upc;
                    let existingItem = inventory[upc];
                    
                    document.getElementById('qty-lock-title').innerText = existingItem ? existingItem.desc : "Unknown Item";
                    document.getElementById('qty-lock-upc').innerText = "UPC: " + upc;
                    document.getElementById('qty-lock-price').innerText = existingItem ? "$" + parseFloat(existingItem.price).toFixed(2) : "$0.00";
                    
                    let baseQty = modifiedItems[upc] ? modifiedItems[upc].qty : (existingItem ? existingItem.qty || 0 : 0);
                    lockedQty = baseQty + 1;
                    document.getElementById('qty-lock-val').innerText = lockedQty;
                    
                    document.getElementById('qty-panel').style.display = 'flex';
                    const flash = document.getElementById('speed-success');
                    flash.innerText = "+1 Scanned!"; flash.style.display = 'block';
                    setTimeout(() => flash.style.display = 'none', 1000);
                    setTimeout(() => requestAnimationFrame(scanVideo), 1000);
                } else if (lockedUPC === upc) {
                    playBeep('success'); lockedQty++;
                    document.getElementById('qty-lock-val').innerText = lockedQty;
                    const flash = document.getElementById('speed-success');
                    flash.innerText = "+1 Scanned!"; flash.style.display = 'block';
                    setTimeout(() => flash.style.display = 'none', 1000);
                    setTimeout(() => requestAnimationFrame(scanVideo), 1000);
                } else { setTimeout(() => requestAnimationFrame(scanVideo), 500); }
            } else {
                playBeep('success'); currentInput = stripZeros(code);
                document.getElementById('upc-display').innerText = currentInput;
                closeCamera(); searchUPC(currentInput);
            }
        }

        function adjustSpeedQty(val) {
            playBeep('tap'); lockedQty += val;
            if (lockedQty < 0) lockedQty = 0;
            document.getElementById('qty-lock-val').innerText = lockedQty;
        }

        function confirmSpeedQty() {
            if (lockedUPC) {
                let existingItem = inventory[lockedUPC] || { desc: "Unknown Item", price: "0.00", dept: "1", mod: "000" };
                let modItem = { ...existingItem, qty: lockedQty, status: inventory[lockedUPC] ? 'QTY UPDATE' : 'NEW' };
                inventory[lockedUPC] = modItem; modifiedItems[lockedUPC] = modItem;
                persistData(); updateInventoryTable(); lockedUPC = null;
                document.getElementById('qty-panel').style.display = 'none';
                showAlert("Saved. Scan next item.", "var(--success)"); requestAnimationFrame(scanVideo);
            }
        }

        function finishSpeedScan() {
            if (lockedUPC) confirmSpeedQty();
            closeCamera(); switchTab('inventory'); window.print();
        }

        function persistData() {
            try {
                localStorage.setItem('commander_inventory', JSON.stringify(inventory));
                localStorage.setItem('commander_modified', JSON.stringify(modifiedItems));
                localStorage.setItem('commander_archives', JSON.stringify(archives));
                document.getElementById('db-count').innerText = Object.keys(inventory).length;
            } catch(e) {}
        }

        function updateInventoryTable() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = ""; let keys = Object.keys(modifiedItems);
            if (keys.length === 0) { list.innerHTML = "<tr><td colspan='4' style='text-align:center; color:var(--gray);'>No active changes.</td></tr>"; return; }
            keys.forEach(upc => {
                let item = modifiedItems[upc];
                let priceHtml = item.oldPrice && item.oldPrice !== item.price ? `<span class="old-price">$${parseFloat(item.oldPrice).toFixed(2)}</span> $${parseFloat(item.price).toFixed(2)}` : `$${parseFloat(item.price).toFixed(2)}`;
                let statColor = item.status === 'DELETED' ? 'var(--danger)' : 'white';
                list.innerHTML += `<tr style="color:${statColor}"><td>${upc}</td><td>${item.desc}</td><td>${item.qty || 0}</td><td>${priceHtml}</td></tr>`;
            });
        }

        // --- Folder Sync Logic ---
        
        // 1. Initial Folder Setup
        async function setupFolderSync() {
            if (!('showDirectoryPicker' in window)) {
                document.getElementById('xml-upload').click();
                return;
            }
            try {
                pluDirectoryHandle = await window.showDirectoryPicker();
                let db = await openDB();
                await saveToDB(db, 'pluFolderHandle', pluDirectoryHandle);
                
                document.getElementById('sync-plu-btn').style.display = 'block';
                document.getElementById('select-folder-btn').innerText = "📂 Change PLU Folder...";
                await syncPLUs(); 
            } catch(e) {
                console.error(e);
            }
        }

        // 2. One-Click Sync Button
        async function syncPLUs() {
            if (!pluDirectoryHandle) return;
            try {
                if (await pluDirectoryHandle.queryPermission({ mode: 'read' }) !== 'granted') {
                    if (await pluDirectoryHandle.requestPermission({ mode: 'read' }) !== 'granted') {
                        showAlert("Permission required to sync folder.", "var(--danger)");
                        return;
                    }
                }
                
                showAlert("Syncing PLUs... Please wait.", "var(--primary)");
                let totalAdded = 0;
                
                for await (const entry of pluDirectoryHandle.values()) {
                    if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.xml')) {
                        const file = await entry.getFile();
                        totalAdded += await parseXMLFile(file);
                    }
                }
                
                if (totalAdded === 0) { 
                    showAlert("No valid PLUs found in folder.", "var(--danger)"); 
                } else {
                    persistData(); 
                    showAlert(`Successfully synced ${totalAdded} items!`, "var(--success)");
                }
            } catch(e) {
                showAlert("Error syncing. Try re-selecting the folder.", "var(--danger)");
            }
        }

        // 3. Fallback for iPhones (Standard File Upload)
        async function handleXMLUpload(event) {
            const files = event.target.files; 
            if (!files || files.length === 0) return;
            showAlert(`Scanning files... Please wait.`, "var(--primary)");
            let totalAdded = 0;
            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                if (file.name.toLowerCase().endsWith('.xml')) {
                    totalAdded += await parseXMLFile(file);
                }
            }
            if (totalAdded === 0) { showAlert("No valid PLUs found.", "var(--danger)"); } 
            else { persistData(); showAlert(`Synced ${totalAdded} items!`, "var(--success)"); }
        }

        // Core XML Parser
        async function parseXMLFile(file) {
            let added = 0;
            try {
                let text = await file.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "text/xml");
                const pluNodes = xmlDoc.getElementsByTagName('*');
                for (let j = 0; j < pluNodes.length; j++) {
                    let node = pluNodes[j];
                    if (node.nodeName.includes("PLU") && node.nodeName !== "domain:PLUs") {
                        let upcNode = node.getElementsByTagName('upc')[0];
                        if(upcNode) {
                            let upc = formatUPC14(upcNode.textContent);
                            let descNode = node.getElementsByTagName('description')[0];
                            let priceNode = node.getElementsByTagName('price')[0];
                            let deptNode = node.getElementsByTagName('department')[0];
                            let modNode = node.getElementsByTagName('upcModifier')[0];
                            inventory[upc] = { desc: descNode ? descNode.textContent : "Unknown", price: priceNode ? parseFloat(priceNode.textContent).toFixed(2) : "0.00", dept: deptNode ? deptNode.textContent : "1", mod: modNode ? modNode.textContent : "000", qty: 0 };
                            added++;
                        }
                    }
                }
            } catch(err) { console.error("Error reading file", file.name); }
            return added;
        }

        function exportXML() {
            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<domain:PLUs xmlns:domain="urn:vfi-sapphire:np.domain.2001-07-01">\n`;
            for (let upc in inventory) {
                let item = inventory[upc];
                if (item.status === 'DELETED') continue;
                xml += `  <domain:PLU>\n    <upc>${upc}</upc>\n    <upcModifier>${item.mod || "000"}</upcModifier>\n    <description>${item.desc}</description>\n    <department>${item.dept || "1"}</department>\n    <price>${item.price}</price>\n    <SellUnit>1.000</SellUnit>\n  </domain:PLU>\n`;
            }
            xml += `</domain:PLUs>`;
            const blob = new Blob([xml], { type: 'text/xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Modified_PLUs.xml'; a.click(); URL.revokeObjectURL(url);
            showAlert("Exported XML successfully.", "var(--success)");
        }

        // Mini Database to remember the folder across app restarts
        function openDB() {
            return new Promise((resolve, reject) => {
                let req = indexedDB.open('StoreScanDB', 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore('settings');
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e);
            });
        }
        function getFromDB(db, key) {
            return new Promise(resolve => {
                if(!db.objectStoreNames.contains('settings')) return resolve(null);
                let req = db.transaction('settings', 'readonly').objectStore('settings').get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }
        function saveToDB(db, key, val) {
            return new Promise(resolve => {
                let tx = db.transaction('settings', 'readwrite');
                tx.objectStore('settings').put(val, key);
                tx.oncomplete = () => resolve();
            });
        }
    </script>
</body>
